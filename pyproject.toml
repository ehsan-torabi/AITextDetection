[project]
name = "aitextd"
version = "2.0.0"
description = "Persian AI-generated text detection: FastAPI serving stack, training pipeline, and shared aitextd package."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "pydantic>=2.13",
    "numpy>=2.4",
    "scipy>=1.17",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "joblib>=1.6",
    "torch>=2.14",
    "transformers>=5.18",
    "huggingface-hub>=1.0",
    "shekar>=1.7",
    "tqdm>=4.70",
    "laya>=0.3.27",
]

[dependency-groups]
dev = ["pytest>=9.1", "ipykernel>=6.29", "nbconvert>=7.16", "nbformat>=5.10"]

# Unified code style for all Python code in this repo (server, aitextd, tests).
# Enforce with:  uvx ruff format .  &&  uvx ruff check --fix .
[tool.ruff]
line-length = 100
target-version = "py311"
# Python only: ruff's default include also picks up Markdown (e.g. vendored
# docs under web-app/.agents), which must not be rewritten by the formatter.
include = ["*.py", "*.pyi"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle errors
    "E7",  # pycodestyle (comparison/statements)
    "E9",  # runtime errors (syntax, undefined names)
    "F",   # pyflakes
    "I",   # import sorting
    "W",   # whitespace
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    # Persian text is legitimate here, not a confusable-unicode typo.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["aitextd"]

[tool.pytest.ini_options]
markers = ["slow: loads the full model registry (needs local artifacts)"]
